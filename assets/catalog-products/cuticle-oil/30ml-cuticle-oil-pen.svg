<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="30ml Cuticle Oil Pen placeholder image">
  <rect width="800" height="800" fill="#faf7f2"/>
  <rect x="0" y="0" width="800" height="800" fill="none" stroke="#e7e0d6" stroke-width="2"/>
  <!-- soft decorative circle -->
  <circle cx="400" cy="390" r="220" fill="#f3ede4"/>
  <circle cx="400" cy="390" r="220" fill="none" stroke="#b9935a" stroke-width="2" stroke-dasharray="6 10" opacity="0.7"/>

  <!-- pen body -->
  <g>
    <!-- cap -->
    <rect x="330" y="240" width="140" height="90" rx="14" fill="#262a2e"/>
    <rect x="330" y="240" width="140" height="90" rx="14" fill="none" stroke="#b9935a" stroke-width="3"/>
    <!-- barrel -->
    <rect x="330" y="330" width="140" height="210" rx="12" fill="#ffffff" stroke="#d8cfc0" stroke-width="3"/>
    <!-- brush tip (cone) -->
    <path d="M330 540 L350 600 L450 600 L470 540 Z" fill="#b9935a"/>
    <path d="M345 600 L380 660 Q400 680 420 660 L455 600 Z" fill="#c9a36b"/>
    <!-- brush bristles -->
    <path d="M380 660 Q400 682 420 660" fill="none" stroke="#8f6e3d" stroke-width="3"/>
    <!-- oil drop -->
    <path d="M400 700 Q392 718 400 728 Q408 718 400 700 Z" fill="#e8b23c" opacity="0.85"/>
    <!-- label band -->
    <rect x="330" y="380" width="140" height="110" fill="#fbf7ef"/>
    <rect x="330" y="380" width="140" height="110" fill="none" stroke="#e7e0d6" stroke-width="2"/>
  </g>

  <!-- text -->
  <text x="400" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#262a2e" letter-spacing="1">30ml Cuticle Oil Pen</text>
  <text x="400" y="775" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6b7075" letter-spacing="2">BRUSH PEN · NAIL CARE · PRIVATE LABEL</text>
</svg>
